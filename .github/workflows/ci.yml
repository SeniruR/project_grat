name: CI

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, typecheck, build, migrations
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: project_grat_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d project_grat_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/project_grat_ci?schema=public
      JWT_SECRET: ci-only-not-for-production
      VITE_API_URL: https://api.example.com
      VITE_COMPOSE_ENABLED: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json
            web/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install API dependencies
        working-directory: api
        run: npm ci

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: API — Prisma generate
        working-directory: api
        run: npm run db:generate

      - name: API — Apply migrations
        working-directory: api
        run: npx prisma migrate deploy

      - name: API — Typecheck
        working-directory: api
        run: npm run typecheck

      - name: Web — Lint
        working-directory: web
        run: npm run lint

      - name: Web — Typecheck
        working-directory: web
        run: npm run typecheck

      - name: Web — Production build
        working-directory: web
        run: npm run build
